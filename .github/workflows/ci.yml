name: CI

on:
  pull_request:
    branches: [ dev, main ]

env:
  # ────────────────────────────────────────────────────────────────────────────
  #  Project-specific environment variables
  #  Replace with your own values or use GitHub Secrets / Actions Variables.
  #  Keep .env.example in sync with the variables listed here.
  # ────────────────────────────────────────────────────────────────────────────
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NODE_ENV: test

jobs:
  ci:
    runs-on: ubuntu-latest

    # ─── Optional: PostgreSQL service (uncomment if your project uses Drizzle) ─
    # services:
    #   postgres:
    #     image: postgres:16-alpine
    #     env:
    #       POSTGRES_USER: test
    #       POSTGRES_PASSWORD: test
    #       POSTGRES_DB: test
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install bun
      run: npm i -g bun

    - name: Install dependencies
      run: bun install

    # ─── Optional: DB migration (uncomment if using Drizzle) ──────────────────
    # - name: Run database migrations
    #   run: bun run db:migrate
    #   env:
    #     DATABASE_URL: postgresql://test:test@localhost:5432/test

    - name: Run linting
      run: bun run lint

    - name: Run type check
      run: bun run type-check

    # ─── Optional: Run tests (uncomment when tests are added) ─────────────────
    # - name: Run tests
    #   run: bun run test
    #   env:
    #     # Add test env vars here or use a shared env: block
